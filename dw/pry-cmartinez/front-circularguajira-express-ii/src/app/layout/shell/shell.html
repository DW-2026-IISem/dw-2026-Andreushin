<div class="flex min-h-screen flex-col bg-slate-100">
  <app-header
    [showSession]="true"
    [authEnabled]="session.authEnabled"
    [username]="username()"
    [initials]="session.initials()"
    [roleLabel]="session.roleLabel()"
    [userItems]="userItems()"
    (menuRequested)="onMenuToggle()"
  />

  <div class="flex flex-1">
    <!--
      Desktop: fixed Aside that the Header button can hide.
      Below lg it is not painted: the menu lives in the Drawer.
    -->
    @if (!sidebarCollapsed()) {
      <aside class="hidden w-72 shrink-0 lg:block">
        <app-aside
          [items]="items()"
          [showSession]="true"
          [username]="username()"
          [roleLabel]="session.roleLabel()"
          [permissionCount]="session.permissionCount()"
          (navigated)="mobileOpen.set(false)"
          (logoutRequested)="logout()"
        />
      </aside>
    }

    <main id="content" class="min-w-0 flex-1 p-4 wrap-break-word sm:p-6">
      <div class="mx-auto w-full max-w-7xl">
        <router-outlet />
      </div>
    </main>
  </div>

  <app-footer />
</div>

<!-- Mobile: the same Aside, another layout. -->
<p-drawer [(visible)]="mobileOpen" header="Menú" position="left" styleClass="w-72">
  <app-aside
    [items]="items()"
    [showSession]="true"
    [username]="username()"
    [roleLabel]="session.roleLabel()"
    [permissionCount]="session.permissionCount()"
    (navigated)="mobileOpen.set(false)"
    (logoutRequested)="logout()"
  />
</p-drawer>

<!-- Hosts of the CRUD notifications and confirmations (ISS-03). -->
<p-toast position="top-right" />
<p-confirmdialog />
